<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Форма обратной связи для отправки обращения"
    >
    <title>Обратная связь</title>
    <link rel="stylesheet" href="styles.css">
    <script src="form.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="contact-card" aria-labelledby="form-title">
        <div class="contact-card__intro">
          <p class="eyebrow">Свяжитесь с нами</p>
          <h1 id="form-title">Форма обратной связи</h1>
          <p class="lead">
            Заполните форму, и мы ответим на указанный email.
          </p>
        </div>

        <form
          class="contact-form"
          id="contact-form"
          action="index.php"
          method="post"
          novalidate
        >
          <input type="hidden" name="custom" value="message">

          <div class="form-field form-field--honeypot" aria-hidden="true">
            <label for="website">Не заполняйте это поле</label>
            <input
              id="website"
              name="website"
              type="text"
              tabindex="-1"
              autocomplete="off"
            >
          </div>

          <div class="form-field">
            <label for="subject">Тема обращения</label>
            <select id="subject" name="subject" required>
              <option value="">Выберите тему</option>
              <option value="Общий вопрос">Общий вопрос</option>
              <option value="Сотрудничество">Сотрудничество</option>
              <option value="Техническая поддержка">
                Техническая поддержка
              </option>
              <option value="Другое">Другое</option>
            </select>
            <span class="field-error" id="subject-error"></span>
          </div>

          <div class="form-grid">
            <div class="form-field">
              <label for="full-name">ФИО</label>
              <input
                id="full-name"
                name="full_name"
                type="text"
                maxlength="255"
                autocomplete="name"
                placeholder="Иванов Иван Иванович"
                required
              >
              <span class="field-error" id="full_name-error"></span>
            </div>

            <div class="form-field">
              <label for="phone">Телефон</label>
              <input
                id="phone"
                name="phone"
                type="tel"
                maxlength="255"
                autocomplete="tel"
                inputmode="tel"
                placeholder="+7 999 123-45-67"
                required
              >
              <span class="field-error" id="phone-error"></span>
            </div>
          </div>

          <div class="form-field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              maxlength="255"
              autocomplete="email"
              placeholder="name@example.com"
              required
            >
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="form-field">
            <label for="message">Сообщение</label>
            <textarea
              id="message"
              name="message"
              rows="6"
              maxlength="4000"
              placeholder="Опишите ваш вопрос"
              required
            ></textarea>
            <div class="field-meta">
              <span class="field-error" id="message-error"></span>
              <span id="message-counter">0 / 4000</span>
            </div>
          </div>

          <fieldset class="captcha-field">
            <legend>Проверка безопасности</legend>
            <div class="captcha-box">
              <img
                id="captcha-image"
                class="captcha-image"
                alt="Код проверки"
                width="190"
                height="64"
              >
              <button
                class="captcha-refresh"
                id="captcha-refresh"
                type="button"
                aria-label="Обновить код проверки"
                title="Обновить код"
              >
                ↻
              </button>
            </div>
            <label for="captcha">Введите код с картинки</label>
            <input
              id="captcha"
              name="captcha"
              type="text"
              maxlength="8"
              autocomplete="off"
              spellcheck="false"
              required
            >
            <span class="field-error" id="captcha-error"></span>
          </fieldset>

          <div class="form-field checkbox-field">
            <input id="consent" name="consent" type="checkbox" value="1" required>
            <label for="consent">
              Я согласен на обработку персональных данных
            </label>
            <span class="field-error" id="consent-error"></span>
          </div>

          <div class="form-error" id="form-error" role="alert"></div>

          <button class="submit-button" id="submit-button" type="submit">
            <span class="submit-button__label">Отправить сообщение</span>
            <span class="submit-button__loader" aria-hidden="true"></span>
          </button>

          <noscript>
            <p class="noscript-message">
              Для проверки формы и отправки через AJAX включите JavaScript.
            </p>
          </noscript>
        </form>
      </section>
    </main>

    <dialog class="result-dialog" id="result-dialog">
      <div class="result-dialog__icon" id="dialog-icon" aria-hidden="true"></div>
      <h2 id="dialog-title">Результат отправки</h2>
      <p id="dialog-message"></p>
      <button class="dialog-button" id="dialog-close" type="button">
        Закрыть
      </button>
    </dialog>
  </body>
</html>
